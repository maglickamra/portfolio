<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study — Amina-Kamra Maglić</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Familjen+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fbfbf7; }
  a { color: #141413; }
  a:hover { color: #141413; }
  @media (pointer: fine) { .cs-root, .cs-root a { cursor: none; } }
  @media (max-width: 760px) { .cs-sec { grid-template-columns: 1fr !important; } }
</style>
</helmet>

<div class="cs-root" style="background: #fbfbf7; color: #141413; font-family: 'Familjen Grotesk', sans-serif; min-height: 100vh; overflow-x: hidden;">

  <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 16px; padding: 22px clamp(18px, 4vw, 48px);">
    <a href="Portfolio v2.dc.html" data-cursor="Home" style="font-family: 'Instrument Serif', serif; font-size: 26px; letter-spacing: -0.01em; text-decoration: none;">Amina-Kamra Maglić</a>
    <nav style="display: flex; gap: 24px; font-size: 15px; font-weight: 500;">
      <a href="Portfolio v2.dc.html#work" data-cursor="All work" style="text-decoration: none;">← All work</a>
      <a href="mailto:maglickamra@gmail.com" data-cursor="Write me" style="text-decoration: none;">Contact</a>
    </nav>
  </header>

  <section style="padding: clamp(30px, 5vw, 72px) clamp(18px, 4vw, 48px) clamp(24px, 3vw, 40px);">
    <div style="font-size: 15px; color: #55544e; margin-bottom: 14px;">{{ p.num }} — {{ p.kicker }}</div>
    <h1 style="font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(54px, 9vw, 148px); line-height: 0.9; letter-spacing: -0.035em; margin: 0 0 clamp(26px, 4vw, 48px);"><span style="background: linear-gradient(transparent 58%, #c6f24e 58%, #c6f24e 92%, transparent 92%); padding: 0 0.04em;">{{ p.title }}</span></h1>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 18px 28px; border-top: 1px solid #141413; padding-top: 16px;">
      <sc-for list="{{ p.meta }}" as="m" hint-placeholder-count="4">
        <div>
          <div style="font-size: 13px; color: #6b6a63; margin-bottom: 4px;">{{ m.k }}</div>
          <div style="font-size: 16px; font-weight: 500; line-height: 1.35;">{{ m.v }}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding: 0 clamp(18px, 4vw, 48px);">
    <div style="border-radius: 12px; overflow: hidden; background: #ecebe4;">
      <img src="{{ p.hero }}" alt="{{ p.title }}" style="width: 100%; max-height: 82vh; object-fit: contain; display: block; margin: 0 auto;">
    </div>
  </section>

  <section style="padding: clamp(40px, 6vw, 88px) clamp(18px, 4vw, 48px) 0;">
    <p style="font-family: 'Instrument Serif', serif; font-size: clamp(26px, 3.2vw, 44px); line-height: 1.15; letter-spacing: -0.01em; margin: 0; max-width: 30ch;">{{ p.intro }}</p>
  </section>

  <section style="padding: clamp(32px, 5vw, 72px) clamp(18px, 4vw, 48px) 0; display: grid; gap: clamp(28px, 4vw, 52px);">
    <sc-for list="{{ p.sections }}" as="s" hint-placeholder-count="3">
      <div class="cs-sec" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px clamp(24px, 4vw, 64px); border-top: 1px solid #dddbd2; padding-top: 18px;">
        <h2 style="font-size: 15px; font-weight: 700; margin: 0;">{{ s.h }}</h2>
        <p style="font-size: clamp(17px, 1.4vw, 19px); line-height: 1.6; margin: 0; max-width: 60ch; text-wrap: pretty;">{{ s.b }}</p>
      </div>
    </sc-for>
  </section>

  <sc-if value="{{ hasGallery }}" hint-placeholder-val="{{ false }}">
    <section style="padding: clamp(40px, 6vw, 80px) clamp(18px, 4vw, 48px) 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: clamp(14px, 2vw, 24px);">
      <sc-for list="{{ p.gallery }}" as="g" hint-placeholder-count="2">
        <div style="border-radius: 10px; overflow: hidden; background: #ecebe4; aspect-ratio: 4 / 3;">
          <img src="{{ g }}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s cubic-bezier(.2,.8,.2,1);" style-hover="transform: scale(1.04);">
        </div>
      </sc-for>
    </section>
  </sc-if>

  <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}">
    <section style="padding: clamp(40px, 6vw, 80px) clamp(18px, 4vw, 48px) 0;">
      <div style="aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #141413;">
        <iframe src="{{ p.video }}" title="Video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen="" style="width: 100%; height: 100%; border: 0; display: block;"></iframe>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{ hasLink }}" hint-placeholder-val="{{ false }}">
    <section style="padding: clamp(32px, 4vw, 56px) clamp(18px, 4vw, 48px) 0;">
      <a href="{{ p.link }}" target="_blank" rel="noopener" data-cursor="Open ↗" style="display: inline-flex; gap: 10px; align-items: center; background: #141413; color: #fbfbf7; text-decoration: none; font-weight: 500; padding: 13px 22px; border-radius: 99px;" style-hover="background: #c6f24e; color: #141413;">{{ p.linkLabel }}</a>
    </section>
  </sc-if>

  <section style="padding: clamp(64px, 9vw, 130px) clamp(18px, 4vw, 48px) clamp(40px, 5vw, 64px);">
    <div style="font-size: 15px; color: #55544e; margin-bottom: 10px;">Sljedeći — next project</div>
    <a href="{{ next.href }}" data-cursor="Next →" style="display: inline-block; font-family: 'Instrument Serif', serif; font-size: clamp(42px, 7vw, 112px); line-height: 0.95; letter-spacing: -0.03em; text-decoration: none; background: linear-gradient(transparent 60%, #c6f24e 60%) no-repeat 0 0 / 0% 100%; transition: background-size .4s ease;" style-hover="background-size: 100% 100%;">{{ next.title }} →</a>
  </section>

  <footer style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 22px clamp(18px, 4vw, 48px); border-top: 1px solid #dddbd2; font-size: 13px; color: #6b6a63;">
    <a href="mailto:maglickamra@gmail.com" style="color: #6b6a63; text-decoration: none;">maglickamra@gmail.com</a>
    <span>© 2026 · Sarajevo · Hvala ✿</span>
  </footer>

  <div ref="{{ cursor }}" style="position: fixed; left: 0; top: 0; z-index: 99; pointer-events: none; display: none; align-items: center; gap: 8px; transform: translate(-6px, -6px);">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #141413; flex: none;"></span>
    <span ref="{{ cursorLabel }}" style="background: #c6f24e; color: #141413; font-size: 14px; font-weight: 700; padding: 5px 11px; border-radius: 99px; white-space: nowrap; transform: scale(0); transform-origin: left center; transition: transform .2s cubic-bezier(.2,.9,.3,1.3);"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;project&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;domicile-rediscovered&quot;,&quot;options&quot;:[&quot;domicile-rediscovered&quot;,&quot;digital-twins&quot;,&quot;journey&quot;,&quot;domicile-augmented&quot;,&quot;expressive-data&quot;,&quot;skripta&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
const PROJECTS = [
  {
    slug: 'domicile-rediscovered', num: '01', title: 'Domicile Rediscovered', kicker: 'Installation',
    meta: [{ k: 'Type', v: 'Interactive installation' }, { k: 'Methods', v: 'Processing, crochet, projection mapping' }, { k: 'Context', v: 'Glasgow School of Art' }, { k: 'Year', v: '2023' }],
    hero: 'assets/slot-p1-hero.webp',
    intro: 'A journey through centuries of female resilience in Bosnia and Herzegovina.',
    sections: [
      { h: 'The idea', b: 'With a focus on emancipation, resistance and empowerment, the piece reveals the methods women have used to display autonomy in a habitually patriarchal society.' },
      { h: 'How it’s made', b: 'Hand-crocheted surfaces become the projection screen: Processing sketches are mapped onto the textile, so a domestic craft carries the story it has always quietly held.' },
      { h: 'Why it matters', b: 'The work treats handcraft as an archive — a way of making overlooked histories visible, and of inviting visitors to read them up close rather than from a wall label.' }
    ],
    gallery: ['assets/slot-p1-a.webp', 'assets/slot-p1-b.webp']
  },
  {
    slug: 'digital-twins', num: '02', title: 'Digital twins at ABB', kicker: 'MSc thesis',
    meta: [{ k: 'Role', v: 'UX researcher' }, { k: 'Partner', v: 'ABB, Västerås' }, { k: 'Methods', v: 'User research, Figma, coded prototype' }, { k: 'Year', v: '2026' }],
    hero: 'assets/abb-interface.png',
    intro: 'Research on digital twins in safety-critical industry that led ABB to start a multi-year R&D project.',
    sections: [
      { h: 'Why it matters', b: 'Commissioning is high-consequence work under time pressure. A misconfigured device means downtime, a return visit or a safety incident — and whoever inherits the panel can’t see what was actually verified.' },
      { h: 'What I did', b: 'Researched operator decision-making and data visualisation in safety-critical environments, designed and iterated the interaction design in Figma, then used Claude and vibe coding to build a working prototype straight from the research findings — reaching a testable build faster than a mock-up-only workflow.' },
      { h: 'Impact', b: 'The findings and prototype led ABB to start a multi-year R&D project.' }
    ],
    gallery: []
  },
  {
    slug: 'journey', num: '03', title: 'Journey', kicker: 'Product design',
    meta: [{ k: 'Role', v: 'Product design & information visualisation' }, { k: 'Team', v: 'Five' }, { k: 'Output', v: 'Working interface' }, { k: 'Year', v: '2025' }],
    hero: 'assets/journey.png',
    intro: 'A flight and destination finder for international friend groups — where passports, not price, decide where you can go together.',
    sections: [
      { h: 'The problem', b: 'Group travel planning breaks down when every passport has different rules. Visa information is scattered and overwhelming.' },
      { h: 'What we built', b: 'A parallel-coordinates flight filter to find the best flight and destination for the whole group, a visa globe that gives a calmer overview of passport requirements, and a trip detail view.' },
      { h: 'All in one place', b: 'Country-specific information — weather, travel advisories — sits next to the flight choice, so the decision happens on one screen.' }
    ],
    gallery: []
  },
  {
    slug: 'domicile-augmented', num: '04', title: 'Domicile Augmented', kicker: 'Installation',
    meta: [{ k: 'Type', v: 'Projection installation' }, { k: 'Methods', v: 'Processing, projection mapping' }, { k: 'Context', v: 'Glasgow School of Art' }, { k: 'Year', v: '2023' }],
    hero: 'assets/slot-p2-hero.webp',
    intro: 'A companion to Domicile Rediscovered, extending the story into projected, reactive imagery.',
    sections: [
      { h: 'The idea', b: 'Placeholder — tell me what this piece adds to Rediscovered and I’ll rewrite this.' },
      { h: 'How it’s made', b: 'Generative visuals written in Processing, projection-mapped onto the space.' }
    ],
    gallery: []
  },
  {
    slug: 'expressive-data', num: '05', title: 'Expressive Data', kicker: 'Creative coding',
    meta: [{ k: 'Methods', v: 'Photography, Processing' }, { k: 'Type', v: 'Generative image series' }, { k: 'Year', v: '2022' }],
    hero: 'assets/slot-p4-hero.webp',
    intro: 'Photographs treated as data — and data turned back into images.',
    sections: [
      { h: 'The idea', b: 'Placeholder — tell me the brief and the dataset and I’ll rewrite this.' },
      { h: 'How it’s made', b: 'Original photography processed through Processing sketches that read pixel values and redraw them as expressive marks.' }
    ],
    gallery: ['assets/slot-p4-a.webp', 'assets/slot-p4-b.webp']
  },
  {
    slug: 'skripta', num: '06', title: 'SKRIPTA IdeaLab', kicker: 'Web development',
    meta: [{ k: 'Role', v: 'Web developer & data analyst' }, { k: 'Stack', v: 'WordPress, WooCommerce, custom themes & plugins' }, { k: 'Client', v: 'SKRIPTA, Sarajevo' }, { k: 'Years', v: '2022–2025' }],
    hero: 'assets/skripta-prostor.png',
    intro: 'Web development and data work for a Sarajevo creative space that rents rooms, runs workshops and consults.',
    sections: [
      { h: 'Web', b: 'Built and modified custom WordPress themes and plugins, including WooCommerce, for the IdeaLab, Prostor, Consulting and Projekti sections of the site.' },
      { h: 'Data', b: 'Built a web scraper with Codex to collect and analyse data for a research project run in collaboration with Harvard.' }
    ],
    gallery: [], link: 'https://www.skripta.ba/prostor.html', linkLabel: 'Visit skripta.ba ↗'
  }
];

class Component extends DCLogic {
  cursor = React.createRef();
  cursorLabel = React.createRef();
  componentDidMount() {
    if (!window.matchMedia('(pointer: fine)').matches) return;
    const c = this.cursor.current, l = this.cursorLabel.current; if (!c || !l) return;
    c.style.display = 'flex';
    this.onMove = (e) => {
      c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px';
      const t = e.target.closest && e.target.closest('[data-cursor]');
      if (t) { l.textContent = t.getAttribute('data-cursor'); l.style.transform = 'scale(1)'; }
      else { l.style.transform = 'scale(0)'; }
    };
    window.addEventListener('mousemove', this.onMove);
  }
  componentWillUnmount() { window.removeEventListener('mousemove', this.onMove); }
  renderVals() {
    const slug = new URLSearchParams(window.location.search).get('p') || this.props.project || PROJECTS[0].slug;
    let i = PROJECTS.findIndex((x) => x.slug === slug); if (i < 0) i = 0;
    const p = PROJECTS[i], n = PROJECTS[(i + 1) % PROJECTS.length];
    if (typeof document !== 'undefined') document.title = p.title + ' — Amina-Kamra Maglić';
    return {
      p, cursor: this.cursor, cursorLabel: this.cursorLabel,
      hasGallery: p.gallery && p.gallery.length > 0,
      hasVideo: !!p.video, hasLink: !!p.link,
      next: { title: n.title, href: 'Case Study.dc.html?p=' + n.slug }
    };
  }
}
</script>
</body>
</html>
