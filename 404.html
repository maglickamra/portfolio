<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Served for missing pages at any depth, on maglickamra.site and on github.io/portfolio.
    // Point relative links at the site root so assets and the home link always resolve.
    (function () {
      var base = location.pathname.indexOf('/portfolio/') === 0 ? '/portfolio/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <title>Page not found | Amina-Kamra Maglić</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="assets/craft.css">
  <script src="assets/site.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fbfbf7; color: #141413; font-family: 'Familjen Grotesk', sans-serif; }
    a { color: #141413; }
    a:hover { color: var(--heritage, #7a1f2b); }
    :focus-visible { outline: 3px solid var(--heritage, #7a1f2b); outline-offset: 3px; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; padding: 22px clamp(18px, 4vw, 48px); }
    header a { display: inline-flex; align-items: center; min-height: 44px; font-family: 'Instrument Serif', serif; font-size: 26px; letter-spacing: -0.01em; text-decoration: none; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(40px, 8vw, 96px) 0; }
    .eyebrow { margin: 0 0 14px; font-size: 15px; color: #55544e; }
    h1 { margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(48px, 8vw, 120px); line-height: 0.95; letter-spacing: -0.03em; }
    h1 .mark { padding: 0 0.05em; white-space: nowrap; background: linear-gradient(transparent 55%, #c6f24e 55%, #c6f24e 92%, transparent 92%); }
    p.lead { margin: 0 0 26px; font-size: clamp(17px, 1.5vw, 20px); line-height: 1.5; max-width: 42ch; }
    .home { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 99px; background: var(--heritage, #7a1f2b); color: var(--heritage-ink, #fbfbf7); text-decoration: none; font-weight: 500; align-self: flex-start; }
    .home:hover { background: var(--heritage-dark, #5e1520); color: var(--heritage-ink, #fbfbf7); }
    .home span { opacity: 0.85; font-weight: 400; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: #6b6a63; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><a href="./">Amina-Kamra Maglić</a></header>
    <main>
      <p class="eyebrow">404</p>
      <h1><span lang="bs" data-bs="notFound">Ovdje nema ničega.</span> <span class="mark">Nothing here.</span></h1>
      <div class="stitch" aria-hidden="true" style="height: 8px; max-width: 560px; margin: clamp(28px, 4vw, 44px) 0;"></div>
      <p class="lead">This page does not exist, or it has moved.</p>
      <a class="home" href="./">Home <span lang="bs" data-bs="home">Početna</span></a>
    </main>
    <footer><span>© 2026 · Sarajevo</span><span>Hvala ✿</span></footer>
  </div>
  <script>
    // Bosnian strings come from the one shared block in assets/site.js.
    if (window.SITE && window.SITE.bs) {
      document.querySelectorAll('[data-bs]').forEach(function (el) {
        var v = window.SITE.bs[el.getAttribute('data-bs')];
        if (v) el.textContent = v;
      });
    }
  </script>
</body>
</html>
